<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050b">
<title>Sabr Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --c: #3fb6ff; --ink: #e8ecff; --dim: #8a90b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #04050b; color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); text-align: center; }
  .hidden { display: none !important; }
  h1 { margin: 0 0 6px; font-family: Orbitron, sans-serif; font-weight: 900; font-size: 40px; letter-spacing: .18em; text-shadow: 0 0 20px var(--c); }
  p { color: var(--dim); line-height: 1.5; max-width: 320px; margin: 6px 0; }
  .room { font-family: Orbitron, sans-serif; letter-spacing: .3em; color: var(--c); font-size: 20px; margin: 10px 0 26px; }
  .big-btn { width: min(300px, 100%); padding: 18px; border: 0; border-radius: 16px; background: var(--c); color: #04050b; font: 900 19px Orbitron, sans-serif; letter-spacing: .1em; box-shadow: 0 0 40px color-mix(in srgb, var(--c) 55%, transparent); }
  .big-btn:active { transform: scale(.98); }
  #err { color: #ff6b81; margin-top: 18px; max-width: 320px; }

  #pad { justify-content: flex-start; gap: 12px; }
  header { width: 100%; display: flex; align-items: center; gap: 10px; }
  #badge { padding: 5px 12px; border-radius: 999px; background: var(--c); color: #04050b; font: 900 14px Orbitron, sans-serif; letter-spacing: .08em; }
  #status { flex: 1; text-align: left; font-size: 13px; color: var(--dim); line-height: 1.35; }
  #status b { color: var(--ink); }
  #reconnectBtn { padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: var(--ink); font: 600 13px Inter, sans-serif; }
  #reconnectBtn.alert { border-color: #ff6b81; color: #ff6b81; }

  #tapZone { flex: 1; width: 100%; border-radius: 24px; border: 2px dashed color-mix(in srgb, var(--c) 45%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: background .15s; }
  #tapZone.flash { background: color-mix(in srgb, var(--c) 25%, transparent); }
  #tapZone.bomb { background: rgba(255, 40, 60, .35); }
  #tapZone .big { font-family: Orbitron, sans-serif; font-size: 20px; font-weight: 900; letter-spacing: .12em; color: var(--c); }
  #blade { width: 10px; height: 80px; border-radius: 6px; background: #fff; box-shadow: 0 0 18px 6px var(--c); transform-origin: 50% 100%; }
  #stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(320px, 92%); margin-top: 8px; }
  #stats div { display: flex; flex-direction: column; gap: 2px; }
  #stats span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #stats b { font: 900 20px Orbitron, sans-serif; }
  .bar { width: min(320px, 92%); height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  #hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4f6e, #ffd34f 45%, #4fffa0); background-size: 320px 100%; transition: width .25s; }
  .swatches { display: flex; gap: 14px; }
  .sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; }
  .sw.on { border-color: #fff; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<section id="intro" class="screen">
  <h1>SABR</h1>
  <p>Your phone becomes the lightsaber.</p>
  <div class="room" id="roomLbl"></div>
  <button id="connectBtn" class="big-btn">CONNECT</button>
  <p style="margin-top:22px">Hold it tight. A wrist strap is a good idea.</p>
  <div id="err"></div>
</section>

<section id="pad" class="screen hidden">
  <header>
    <span id="badge">--</span>
    <div id="status">Connecting...</div>
    <button id="reconnectBtn">Reconnect</button>
  </header>
  <div id="tapZone">
    <div id="blade"></div>
    <div class="big">TAP TO RECENTER</div>
    <p>Point the top of the phone at the game screen, then tap.</p>
    <div class="bar"><div id="hp"></div></div>
    <div id="stats">
      <div><span>Team</span><b id="sScore">0</b></div>
      <div><span>Combo</span><b id="sCombo">0</b></div>
      <div><span>Your cuts</span><b id="sMine">0</b></div>
    </div>
  </div>
  <button id="actionBtn" class="big-btn hidden">START GAME</button>
  <div class="swatches" id="swatches"></div>
</section>

<script>
const PEER_PREFIX = 'sabrgamr-';
const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const $ = (id) => document.getElementById(id);
const COLORS = ['#3fb6ff', '#ff3b5c', '#3dff7a', '#ffb02e', '#b45cff'];

// A stable id per phone so a reconnect gets the same player slot and stats back.
let pid = '';
try { pid = localStorage.getItem('sabr-pid') || ''; } catch {}
if (!pid) {
  pid = 'p' + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem('sabr-pid', pid); } catch {}
}

let peer = null, conn = null, connected = false, gotSensor = false, wakeLock = null;
let myColor = null, permNote = '', retryTimer = 0, retryDelay = 1000, gameState = 'lobby';

$('roomLbl').textContent = room ? 'ROOM ' + room : '';
if (!room) {
  $('connectBtn').disabled = true;
  $('err').textContent = 'No room code. Scan the QR code shown on the game screen.';
} else if (!window.isSecureContext) {
  $('err').textContent = 'Motion sensors need HTTPS. Open the deployed https:// link.';
}

COLORS.forEach((c) => {
  const el = document.createElement('div');
  el.className = 'sw';
  el.dataset.c = c;
  el.style.background = c;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    setColor(c);
    send({ t: 'c', c });
  });
  $('swatches').appendChild(el);
});

function setColor(c) {
  myColor = c;
  document.documentElement.style.setProperty('--c', c);
  document.querySelectorAll('.sw').forEach((s) => s.classList.toggle('on', s.dataset.c === c));
}

$('connectBtn').addEventListener('click', async () => {
  $('err').textContent = '';
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
  try {
    // iOS 13+ (and some newer browsers) gate motion behind a permission prompt from a user gesture
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') permNote = 'Motion access was denied. Reload the page and allow it.';
    }
  } catch (e) {
    permNote = 'Could not get motion permission: ' + e.message;
  }
  try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch {}
  requestWakeLock();
  addEventListener('deviceorientation', onOrientation);
  $('intro').classList.add('hidden');
  $('pad').classList.remove('hidden');
  connect();
  setTimeout(() => {
    if (!gotSensor) setStatus('<b>No motion sensor data.</b> ' + (permNote || 'This device or browser may not have a gyroscope.'));
  }, 2500);
});

function onOrientation(e) {
  if (e.alpha == null) return;
  gotSensor = true;
  if (!connected) return;
  conn.send({ t: 'o', a: +e.alpha.toFixed(2), b: +e.beta.toFixed(2), g: +e.gamma.toFixed(2) });
  $('blade').style.transform = `rotate(${(-e.gamma).toFixed(1)}deg)`;
}

let connectingSince = 0, watchdog = 0;
function connect() {
  clearTimeout(retryTimer);
  retryTimer = 0;
  try { peer?.destroy(); } catch {}
  connected = false;
  connectingSince = Date.now();
  clearTimeout(watchdog);
  watchdog = setTimeout(() => { if (!connected) lost('Timed out.'); }, 10000);
  setStatus('Connecting to room <b>' + room + '</b>...');
  $('reconnectBtn').classList.remove('alert');
  const myPeer = new Peer();
  peer = myPeer;
  myPeer.on('open', () => {
    const c = myPeer.connect(PEER_PREFIX + room, { reliable: false, serialization: 'json' });
    conn = c;
    c.on('open', () => {
      if (peer !== myPeer) return;
      connected = true;
      connectingSince = 0;
      clearTimeout(watchdog);
      retryDelay = 1000;
      c.send({ t: 'hello', pid, color: myColor });
      setStatus('<b>Connected</b> to room ' + room);
      buzz(40);
    });
    c.on('data', onData);
    c.on('close', () => { if (peer === myPeer) lost('Connection lost.'); });
    c.on('error', () => { if (peer === myPeer) lost('Connection error.'); });
  });
  myPeer.on('error', (e) => {
    if (peer !== myPeer) return;
    if (e.type === 'peer-unavailable') lost('Game not found. Is the game screen open?');
    else lost('Connection problem (' + e.type + ').');
  });
}

// Auto-retry with backoff; the Reconnect button retries immediately.
function lost(why) {
  if (retryTimer) return; // a retry is already scheduled
  connected = false;
  connectingSince = 0;
  clearTimeout(watchdog);
  $('reconnectBtn').classList.add('alert');
  setStatus('<b>' + why + '</b> Retrying in ' + Math.round(retryDelay / 1000) + 's...');
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { retryTimer = 0; connect(); }, retryDelay);
  retryDelay = Math.min(retryDelay * 1.6, 8000);
}

$('reconnectBtn').addEventListener('click', () => {
  retryDelay = 1000;
  retryTimer = 0;
  connect();
});

function onData(d) {
  switch (d.t) {
    case 'welcome':
      $('badge').textContent = d.name;
      setColor(d.color);
      setGameState(d.state);
      break;
    case 'full':
      setStatus('<b>Room is full</b> (4 players max).');
      break;
    case 'state': setGameState(d.s); break;
    case 'h': buzz(30); break;
    case 'bomb':
      buzz([80, 40, 120]);
      $('tapZone').classList.add('bomb');
      setTimeout(() => $('tapZone').classList.remove('bomb'), 300);
      break;
    case 'p': send({ t: 'q', ts: d.ts }); break;
    case 'stats':
      $('sScore').textContent = d.score.toLocaleString();
      $('sCombo').textContent = d.combo;
      $('sMine').textContent = d.mine;
      $('hp').style.width = Math.max(0, d.health) + '%';
      if (d.state !== gameState) setGameState(d.state);
      break;
  }
}

function setGameState(s) {
  gameState = s;
  const btn = $('actionBtn');
  btn.classList.toggle('hidden', s === 'playing' || s === 'countdown');
  btn.textContent = s === 'over' ? 'PLAY AGAIN' : 'START GAME';
}

$('actionBtn').addEventListener('click', () => { send({ t: 'start' }); buzz(20); });

function send(msg) { if (connected && conn && conn.open) conn.send(msg); }
function buzz(pattern) { try { navigator.vibrate?.(pattern); } catch {} }
function setStatus(html) { $('status').innerHTML = html; }

$('tapZone').addEventListener('pointerdown', () => {
  send({ t: 'r' });
  buzz(15);
  $('tapZone').classList.add('flash');
  setTimeout(() => $('tapZone').classList.remove('flash'), 150);
});

async function requestWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || $('pad').classList.contains('hidden')) return;
  requestWakeLock();
  // reconnect right away after the phone wakes up, unless an attempt is already underway
  const busy = connectingSince && Date.now() - connectingSince < 8000;
  if (!connected && !busy) { retryDelay = 1000; connect(); }
});
</script>
</body>
</html>
